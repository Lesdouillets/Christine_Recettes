<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réparation photos</title>
<style>
  body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
  button { background: #f97316; color: white; border: none; padding: 1rem 2rem; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.5rem; }
  button:disabled { background: #ccc; cursor: default; }
  #log { margin-top: 1rem; background: #f5f5f5; padding: 1rem; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 500px; overflow-y: auto; }
  input[type=file] { margin: 1rem 0; display: block; font-size: 1rem; }
</style>
</head>
<body>
<h2>🔧 Réparation complète</h2>
<p>Sélectionne l'export JSON du 28 mars, puis lance la réparation.</p>
<input type="file" id="jsonFile" accept=".json">
<br>
<button id="btn" onclick="run()" disabled>🔧 Réparer</button>
<div id="log">En attente du fichier JSON...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyB-vaVqrejkRAiW5q3sQvy9crl5RzDeIzc",
  authDomain:        "mes-recettes-bd049.firebaseapp.com",
  projectId:         "mes-recettes-bd049",
  storageBucket:     "mes-recettes-bd049.firebasestorage.app",
  messagingSenderId: "239169207922",
  appId:             "1:239169207922:web:1b3d67548cc7bbd8ad0ceb"
});
const db    = firebase.firestore();
const STORE = db.collection('data').doc('main');

let exportData = null;

document.getElementById('jsonFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      exportData = JSON.parse(ev.target.result);
      log(`✅ Fichier chargé : ${exportData.length} recettes`);
      document.getElementById('btn').disabled = false;
    } catch(err) {
      log('❌ Erreur lecture JSON : ' + err.message);
    }
  };
  reader.readAsText(file);
});

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n' + msg;
  el.scrollTop = el.scrollHeight;
}

function normalize(name) {
  return (name || '').toLowerCase().trim().replace(/\s+/g, ' ');
}

async function run() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log('\n⏳ Lecture de mealPlan et customCats depuis Firebase...');

  try {
    // ── 1. Lire UNIQUEMENT mealPlan + customCats depuis Firebase ──
    const snap = await STORE.get();
    const d = snap.data() || {};
    const mealPlan   = d.mealPlan   || {};
    const customCats = d.customCats || [];
    log(`✅ mealPlan et customCats récupérés`);

    // ── 2. Dédupliquer l'export par nom (garder la plus récente) ──
    log(`\n⏳ Déduplication de l'export...`);
    const map = new Map();
    for (const r of exportData) {
      const key = normalize(r.name);
      if (!key) continue;
      const existing = map.get(key);
      if (!existing) {
        map.set(key, r);
      } else {
        const tsExisting = existing.updatedAt || existing.createdAt || 0;
        const tsThis     = r.updatedAt || r.createdAt || 0;
        // Préférer la version avec photo Cloudinary si disponible
        const existingHasUrl = existing.photo && existing.photo.startsWith('http');
        const thisHasUrl     = r.photo && r.photo.startsWith('http');
        if (thisHasUrl && !existingHasUrl) {
          map.set(key, r);
        } else if (!existingHasUrl && !thisHasUrl && tsThis > tsExisting) {
          map.set(key, r);
        } else if (existingHasUrl && !thisHasUrl) {
          // garder existing
        } else if (tsThis > tsExisting) {
          map.set(key, r);
        }
      }
    }
    const deduped = Array.from(map.values());
    log(`✅ ${deduped.length} recettes uniques`);

    // ── 3. Nettoyer les photos : garder URL Cloudinary, supprimer base64 ──
    log(`\n⏳ Nettoyage des photos...`);
    let urlOk = 0, base64Removed = 0, noPhoto = 0;
    const cleanRecipes = deduped.map(r => {
      const { photo, ...rest } = r;
      if (photo && photo.startsWith('http')) {
        urlOk++;
        return { ...rest, photo };
      } else if (photo && photo.startsWith('data:')) {
        base64Removed++;
        return rest; // on supprime le base64 (trop lourd pour Firebase)
      } else {
        noPhoto++;
        return rest;
      }
    });

    log(`  ✅ ${urlOk} photos Cloudinary conservées`);
    log(`  🗑️  ${base64Removed} photos base64 supprimées (trop lourdes)`);
    log(`  ⚪ ${noPhoto} recettes sans photo`);

    // ── 4. Vérifier la taille ──
    const toWrite = {
      recipes:    cleanRecipes,
      mealPlan,
      customCats,
      modifiedAt: Date.now(),
      resetAt:    Date.now()
    };
    const size = JSON.stringify(toWrite).length;
    log(`\n📏 Taille du document à écrire : ${Math.round(size / 1024)} KB`);

    if (size > 950000) {
      log('⚠️  Encore trop grand ! Abandon.');
      btn.disabled = false;
      return;
    }

    // ── 5. Écrire dans Firebase ──
    log(`\n⏳ Écriture dans Firebase...`);
    await STORE.set(toWrite);

    log(`✅ Firebase mis à jour !`);
    log(`🔄 Force-sync déclenché → tous les appareils vont se mettre à jour`);
    log(`\n🎉 Terminé ! Recharge l'application.`);

  } catch(e) {
    log('❌ Erreur : ' + e.message);
    btn.disabled = false;
  }
}

document.getElementById('log').textContent = 'En attente du fichier JSON...';
</script>
</body>
</html>
