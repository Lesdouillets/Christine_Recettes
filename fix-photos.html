<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Reset base recettes</title>
<style>
  body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
  button { background: #f97316; color: white; border: none; padding: 1rem 2rem; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.5rem; }
  button:disabled { background: #ccc; cursor: default; }
  #log { margin-top: 1rem; background: #f5f5f5; padding: 1rem; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 500px; overflow-y: auto; }
  input[type=file] { margin: 1rem 0; display: block; font-size: 1rem; }
</style>
</head>
<body>
<h2>🔄 Remise à zéro depuis l'export JSON</h2>
<p>Sélectionne ton export JSON du 28 mars, puis lance la réinitialisation.</p>
<input type="file" id="jsonFile" accept=".json">
<br>
<button id="btn" onclick="run()" disabled>🚀 Réinitialiser depuis l'export</button>
<div id="log">En attente du fichier JSON...</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyB-vaVqrejkRAiW5q3sQvy9crl5RzDeIzc",
  authDomain:        "mes-recettes-bd049.firebaseapp.com",
  projectId:         "mes-recettes-bd049",
  storageBucket:     "mes-recettes-bd049.firebasestorage.app",
  messagingSenderId: "239169207922",
  appId:             "1:239169207922:web:1b3d67548cc7bbd8ad0ceb"
});
const db    = firebase.firestore();
const STORE = db.collection('data').doc('main');

let exportData = null;

document.getElementById('jsonFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      exportData = JSON.parse(ev.target.result);
      log(`✅ Fichier chargé : ${exportData.length} recettes`);
      document.getElementById('btn').disabled = false;
    } catch(err) {
      log('❌ Erreur lecture JSON : ' + err.message);
    }
  };
  reader.readAsText(file);
});

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n' + msg;
  el.scrollTop = el.scrollHeight;
}

function normalize(name) {
  return (name || '').toLowerCase().trim().replace(/\s+/g, ' ');
}

async function run() {
  const btn = document.getElementById('btn');
  btn.disabled = true;

  try {
    // ── 1. Dédupliquer l'export par nom ──
    log('⏳ Déduplication...');
    const map = new Map();
    for (const r of exportData) {
      const key = normalize(r.name);
      if (!key) continue;
      const existing = map.get(key);
      if (!existing) {
        map.set(key, r);
      } else {
        const hasUrl     = r.photo        && r.photo.startsWith('http');
        const existHasUrl = existing.photo && existing.photo.startsWith('http');
        const tsNew      = r.updatedAt        || r.createdAt        || 0;
        const tsExist    = existing.updatedAt || existing.createdAt || 0;
        // Priorité : avoir une URL Cloudinary > être plus récent
        if (hasUrl && !existHasUrl) map.set(key, r);
        else if (!hasUrl && !existHasUrl && tsNew > tsExist) map.set(key, r);
        else if (hasUrl && existHasUrl && tsNew > tsExist) map.set(key, r);
      }
    }

    const deduped = Array.from(map.values());
    log(`✅ ${deduped.length} recettes uniques`);

    // ── 2. Nettoyer les photos : garder uniquement les URLs Cloudinary ──
    log('⏳ Nettoyage des photos...');
    let urlOk = 0, base64Dropped = 0, noPhoto = 0;

    const cleanRecipes = deduped.map(r => {
      // On ne garde que les champs utiles, sans base64
      const clean = {
        id:           r.id,
        name:         r.name,
        category:     r.category,
        tags:         r.tags,
        ingredients:  r.ingredients,
        instructions: r.instructions,
        portions:     r.portions,
        prepTime:     r.prepTime,
        cookTime:     r.cookTime,
        source:       r.source,
        notes:        r.notes,
        createdAt:    r.createdAt,
        updatedAt:    r.updatedAt,
        dateAdded:    r.dateAdded,
      };
      // Supprimer les clés undefined
      Object.keys(clean).forEach(k => clean[k] === undefined && delete clean[k]);

      if (r.photo && r.photo.startsWith('http')) {
        clean.photo = r.photo;
        urlOk++;
      } else if (r.photo && r.photo.startsWith('data:')) {
        base64Dropped++;
        // On ne met pas la photo — elle sera chargée depuis la collection photos/
      } else {
        noPhoto++;
      }
      return clean;
    });

    log(`  ✅ ${urlOk} photos Cloudinary`);
    log(`  🗑️  ${base64Dropped} photos base64 supprimées`);
    log(`  ⚪ ${noPhoto} sans photo`);

    // ── 3. Construire le document final (sans lire Firebase pour les recettes) ──
    const now = Date.now();
    const toWrite = {
      recipes:      cleanRecipes,
      mealPlan:     {},
      customCats:   [],
      lastModified: now,   // champ lu par app.js
      resetAt:      now,   // force tous les appareils à recharger
    };

    const sizeKB = Math.round(JSON.stringify(toWrite).length / 1024);
    log(`\n📏 Taille du document : ${sizeKB} KB (limite : 1024 KB)`);

    if (sizeKB > 950) {
      log('❌ Document encore trop grand. Impossible d\'écrire.');
      btn.disabled = false;
      return;
    }

    // ── 4. Écrire dans Firebase ──
    log('⏳ Écriture dans Firebase...');
    await STORE.set(toWrite);

    log('✅ Firebase réinitialisé !');
    log('🔄 Force-sync déclenché → tous les appareils vont recharger');
    log('\n⚠️  Note : le planning (mealPlan) a été remis à zéro.');
    log('🎉 Terminé ! Recharge l\'application sur tous tes appareils.');

  } catch(e) {
    log('❌ Erreur : ' + e.message);
    btn.disabled = false;
  }
}

document.getElementById('log').textContent = 'En attente du fichier JSON...';
</script>
</body>
</html>
